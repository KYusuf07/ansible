- name: print OS is Redhat or not
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: Install nginx in Redhat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Redhat"
    
  - name: Install nginx in debian
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"  
    


