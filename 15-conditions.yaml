- name: print OS is Redhat or not
  hosts: local
  connection: local
  tasks:
  - name: Install nginx in Redhat
    dnf:
      state: "present"
      name: nginx
    when: ansible_facts.os_family == "Redhat"
    
  - name: Install nginx in debian
    dnf:
      state: "present"
      name: nginx
    when: ansible_facts.os_family == "Debian"  
    


